<html lang="ko">

    <meta name="apple-mobile-web-app-title" content="우리두리" />

    <meta name="description" content="커플을 위한 우리만의 공간 - 일정, 추억, 여행을 함께" />

    <!-- Open Graph / 카카오톡·디스코드 등 링크 공유 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://twogether-206fb.web.app" />
    <meta property="og:site_name" content="우리두리" />
    <meta property="og:title" content="우리두리 - 둘이 함께하는 모든 순간" />
    <meta property="og:description" content="커플을 위한 우리만의 공간 - 일정, 추억, 여행을 함께" />

    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="우리두리 - 둘이 함께하는 모든 순간" />
    <meta name="twitter:description" content="커플을 위한 우리만의 공간 - 일정, 추억, 여행을 함께" />
    <meta name="twitter:image" content="https://twogether-206fb.web.app/og-image.png" />

    <title>우리두리</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fdf5f7 0%, #fff0f5 100%);
        gap: 1rem;
        pointer-events: none;
      }
      #app-preloader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #ffb6c1;
        border-top-color: #ff6b6b;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      #app-preloader-text {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: #b5838d;
        font-family: 'Gowun Dodum', sans-serif;
        letter-spacing: 0.05em;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader">
        <div id="app-preloader-spinner"></div>
        <p id="app-preloader-text">우리두리</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
